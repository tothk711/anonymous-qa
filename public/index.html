<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Q&A</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: #16213e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #e94560;
            font-size: 1.8rem;
        }

        .login-box input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: none;
            border-radius: 8px;
            background: #1a1a2e;
            color: #eee;
            font-size: 1rem;
        }

        .login-box input::placeholder {
            color: #666;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #ff6b6b;
        }

        .login-error {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        /* Main App */
        .app-container {
            display: none;
            min-height: 100vh;
        }

        .header {
            background: #16213e;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            color: #e94560;
            font-size: 1.4rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            background: #0f3460;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .user-badge.admin {
            background: #e94560;
            color: white;
        }

        .refresh-btn {
            background: #0f3460;
            border: none;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #1a3a6e;
            color: #eee;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            border-color: #e94560;
            color: #e94560;
        }

        /* Question Form */
        .question-form {
            background: #16213e;
            padding: 20px 24px;
            border-bottom: 1px solid #0f3460;
        }

        .question-form textarea {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1a1a2e;
            color: #eee;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .question-form textarea::placeholder {
            color: #666;
        }

        .question-form button {
            margin-top: 12px;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            background: #e94560;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .question-form button:hover {
            background: #ff6b6b;
        }

        /* Questions List */
        .questions-list {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .no-questions {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 1.1rem;
        }

        .question-card {
            background: #16213e;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
        }

        .question-side {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            border-right: 1px solid #0f3460;
            position: relative;
        }

        .answer-side {
            flex: 1;
            min-width: 300px;
            padding: 20px;
            background: #1a1a2e;
            position: relative;
        }

        .question-text {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 12px;
            padding-right: 30px;
        }

        .question-time {
            font-size: 0.8rem;
            color: #666;
        }

        .answer-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #aaa;
            padding-right: 30px;
        }

        .answer-text.has-answer {
            color: #4ecca3;
        }

        .no-answer {
            color: #555;
            font-style: italic;
        }

        /* Delete buttons */
        .delete-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #e94560;
            color: white;
        }

        .delete-answer-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .delete-answer-btn:hover {
            background: #e94560;
            color: white;
        }

        /* Answer Form (Admin) */
        .answer-form {
            margin-top: 12px;
        }

        .answer-form textarea {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #16213e;
            color: #eee;
            font-size: 0.95rem;
            resize: vertical;
            min-height: 60px;
            font-family: inherit;
        }

        .answer-form textarea::placeholder {
            color: #555;
        }

        .answer-form button {
            margin-top: 8px;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #4ecca3;
            color: #1a1a2e;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .answer-form button:hover {
            background: #7ff5c9;
        }

        .answer-meta {
            font-size: 0.75rem;
            color: #555;
            margin-top: 8px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .question-side, .answer-side {
                min-width: 100%;
            }
            
            .question-side {
                border-right: none;
                border-bottom: 1px solid #0f3460;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginScreen">
        <div class="login-box">
            <h1>🔐 Anonymous Q&A</h1>
            <div class="login-error" id="loginError"></div>
            <input type="text" id="username" placeholder="Username" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Log In</button>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <div class="header">
            <h1>📝 Anonymous Q&A</h1>
            <div class="header-right">
                <span class="user-badge" id="userBadge">Guest</span>
                <button class="refresh-btn" onclick="loadQuestions()">🔄 Refresh</button>
                <button class="logout-btn" onclick="logout()">Log Out</button>
            </div>
        </div>

        <div class="question-form">
            <textarea id="questionInput" placeholder="Ask a question anonymously..."></textarea>
            <button onclick="submitQuestion()">Submit Question</button>
        </div>

        <div class="questions-list" id="questionsList">
            <div class="loading">Loading questions...</div>
        </div>
    </div>

    <script>
        // State
        let currentUser = null; // 'guest' or 'admin'
        let credentials = null; // base64 encoded
        let questions = [];

        // Get auth header
        function getAuthHeader() {
            return { 'Authorization': 'Basic ' + credentials };
        }

        // Login
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    currentUser = data.role;
                    credentials = btoa(username + ':' + password);
                    showApp();
                } else {
                    errorEl.textContent = 'Invalid credentials. Try again.';
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Try again.';
            }
        }

        // Handle Enter key
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
            document.getElementById('username').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('password').focus();
            });
        });

        // Show main app
        function showApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            
            const badge = document.getElementById('userBadge');
            if (currentUser === 'admin') {
                badge.textContent = '🔑 Admin';
                badge.classList.add('admin');
            } else {
                badge.textContent = '👤 Guest';
                badge.classList.remove('admin');
            }
            
            loadQuestions();
        }

        // Logout
        function logout() {
            currentUser = null;
            credentials = null;
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').textContent = '';
        }

        // Load questions from server
        async function loadQuestions() {
            try {
                const res = await fetch('/api/questions', {
                    headers: getAuthHeader()
                });
                questions = await res.json();
                renderQuestions();
            } catch (err) {
                document.getElementById('questionsList').innerHTML = 
                    '<div class="loading">Error loading questions. Try refreshing.</div>';
            }
        }

        // Submit question
        async function submitQuestion() {
            const input = document.getElementById('questionInput');
            const text = input.value.trim();
            
            if (!text) return;

            try {
                await fetch('/api/questions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuthHeader()
                    },
                    body: JSON.stringify({ text })
                });
                input.value = '';
                loadQuestions();
            } catch (err) {
                alert('Error submitting question. Try again.');
            }
        }

        // Submit answer (admin only)
        async function submitAnswer(questionId) {
            const textarea = document.getElementById(`answer-${questionId}`);
            const text = textarea.value.trim();
            
            if (!text) return;

            try {
                await fetch(`/api/questions/${questionId}/answer`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        ...getAuthHeader()
                    },
                    body: JSON.stringify({ answer: text })
                });
                loadQuestions();
            } catch (err) {
                alert('Error submitting answer. Try again.');
            }
        }

        // Delete question (admin only)
        async function deleteQuestion(questionId) {
            if (!confirm('Delete this question and its answer?')) return;

            try {
                await fetch(`/api/questions/${questionId}`, {
                    method: 'DELETE',
                    headers: getAuthHeader()
                });
                loadQuestions();
            } catch (err) {
                alert('Error deleting question. Try again.');
            }
        }

        // Delete answer (admin only)
        async function deleteAnswer(questionId) {
            if (!confirm('Delete this answer?')) return;

            try {
                await fetch(`/api/questions/${questionId}/answer`, {
                    method: 'DELETE',
                    headers: getAuthHeader()
                });
                loadQuestions();
            } catch (err) {
                alert('Error deleting answer. Try again.');
            }
        }

        // Format timestamp
        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            return date.toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Render questions
        function renderQuestions() {
            const container = document.getElementById('questionsList');
            
            if (questions.length === 0) {
                container.innerHTML = '<div class="no-questions">No questions yet. Be the first to ask!</div>';
                return;
            }

            container.innerHTML = questions.map(q => `
                <div class="question-card">
                    <div class="question-side">
                        ${currentUser === 'admin' ? `
                            <button class="delete-btn" onclick="deleteQuestion(${q.id})" title="Delete question">🗑</button>
                        ` : ''}
                        <div class="question-text">${escapeHtml(q.text)}</div>
                        <div class="question-time">Asked ${formatTime(q.created_at)}</div>
                    </div>
                    <div class="answer-side">
                        ${q.answer ? `
                            ${currentUser === 'admin' ? `
                                <button class="delete-answer-btn" onclick="deleteAnswer(${q.id})" title="Delete answer">🗑</button>
                            ` : ''}
                            <div class="answer-text has-answer">${escapeHtml(q.answer)}</div>
                            <div class="answer-meta">Answered ${formatTime(q.answered_at)}</div>
                        ` : `
                            <div class="no-answer">No answer yet</div>
                        `}
                        ${currentUser === 'admin' ? `
                            <div class="answer-form">
                                <textarea id="answer-${q.id}" placeholder="Write an answer...">${q.answer || ''}</textarea>
                                <button onclick="submitAnswer(${q.id})">${q.answer ? 'Update Answer' : 'Submit Answer'}</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
